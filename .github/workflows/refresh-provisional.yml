name: 주요품목·국가 잠정 수출 갱신

on:
  push:
    branches: [main]
    paths:
      - provisional_trade.py
      - .github/workflows/refresh-provisional.yml
  workflow_dispatch:
  schedule:
    # API 공식 제공일: 11일, 21일, 익월 1일. 정확한 갱신 시각은 미공개.
    # 매일 KST 08:05, 09:05, 12:05, 18:05 조회 (UTC의 23시는 다음날 08시).
    - cron: '5 23,0,3,9 * * *'
    # 제공일 및 휴일/반영 지연 대비 추가 KST 10:05, 11:05, 14:05~17:05 조회.
    - cron: '5 1,2,5,6,7,8 1-3,11-14,21-24 * *'

permissions:
  contents: write

concurrency:
  group: investment-advisor-provisional-refresh
  cancel-in-progress: false

jobs:
  provisional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
      CUSTOMS_PROVISIONAL_SERVICE_KEY: ${{ secrets.CUSTOMS_PROVISIONAL_SERVICE_KEY }}
      CUSTOMS_PROVISIONAL_COUNTRY_KEY: ${{ secrets.CUSTOMS_PROVISIONAL_COUNTRY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 집계·성장률·수정 이력 검증
        run: python -m pytest -q tests/test_provisional_trade.py
      - name: 실제 API 조회
        id: fetch
        continue-on-error: true
        run: python provisional_trade.py
      - name: 조회 결과와 최신 스냅샷 반영
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/provisional_status.json
          if [ -f data/export_provisional.csv ]; then
            git add -f data/export_provisional.csv data/export_provisional_history.csv
          fi
          git diff --cached --quiet || git commit -m "data: refresh official provisional exports"
          git pull --rebase origin main
          git push
      - name: API 오류 확인
        if: steps.fetch.outcome == 'failure'
        run: exit 1
