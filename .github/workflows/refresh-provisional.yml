name: 주요품목·국가 잠정 수출 갱신

on:
  push:
    branches: [main]
    paths:
      - provisional_trade.py
      - .github/workflows/refresh-provisional.yml
  workflow_dispatch:
  schedule:
    # 한국시간 09:15, 12:15, 18:15: 발표 및 API 반영 지연을 고려해 재조회
    - cron: '15 0,3,9 * * *'

permissions:
  contents: write

concurrency:
  group: investment-advisor-data-refresh
  cancel-in-progress: false

jobs:
  provisional:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
      CUSTOMS_PROVISIONAL_SERVICE_KEY: ${{ secrets.CUSTOMS_PROVISIONAL_SERVICE_KEY }}
      CUSTOMS_PROVISIONAL_COUNTRY_KEY: ${{ secrets.CUSTOMS_PROVISIONAL_COUNTRY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: 집계·성장률·수정 이력 검증
        run: python -m pytest -q tests/test_provisional_trade.py
      - name: 실제 API 조회
        id: fetch
        continue-on-error: true
        run: python provisional_trade.py
      - name: 조회 결과와 최신 스냅샷 반영
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/provisional_status.json
          if [ -f data/export_provisional.csv ]; then
            git add -f data/export_provisional.csv data/export_provisional_history.csv
          fi
          git diff --cached --quiet || git commit -m "data: refresh official provisional exports"
          git pull --rebase origin main
          git push
      - name: API 오류 확인
        if: steps.fetch.outcome == 'failure'
        run: exit 1
