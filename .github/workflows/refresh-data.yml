name: 최신 데이터 갱신

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: investment-advisor-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
      KOSIS_HISTORY_MONTHS: '600'
      CUSTOMS_HISTORY_START: '1995-01'
      CUSTOMS_BOOTSTRAP_MONTHS: '24'
      CUSTOMS_ITEM_COUNTRY_MONTHS: '24'
      CUSTOMS_TRACK_COUNTRIES: 'US,CN,VN,JP'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 원본 DB 상태 복원
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-state --pattern raw-state.zip
          unzip -o raw-state.zip
          test -f data/investment_advisor.sqlite
      - name: API 갱신 및 공유 Mart 생성
        run: python scheduled_refresh.py
      - name: 공유 Mart 검증
        run: python validate_snapshot.py data/share_snapshot.sqlite
      - name: 원본 DB 상태 보관
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j raw-state.next.zip data/investment_advisor.sqlite data/kosis_cycle_cache.csv data/export_flash_cache.csv
          mv raw-state.next.zip raw-state.zip
          gh release upload data-state raw-state.zip --clobber
      - name: 검증된 공유 Mart 반영
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/share_snapshot.sqlite data/refresh_status.json data/export_flash_cache.csv
          git diff --cached --quiet || git commit -m "data: refresh verified dashboard snapshot"
          git push
