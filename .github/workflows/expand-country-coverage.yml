name: 월별 국가 데이터 확대
on:
  push:
    branches: [main]
    paths:
      - refresh_country_coverage.py
      - .github/workflows/expand-country-coverage.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: investment-advisor-data-refresh
  cancel-in-progress: false
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CUSTOMS_SERVICE_KEY: ${{ secrets.CUSTOMS_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 원본 DB 상태 복원
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download data-state --pattern raw-state.zip
          unzip -o raw-state.zip -d data
      - name: 국가별 월간 품목 수집 및 검증
        run: python refresh_country_coverage.py
      - name: 검증된 원본 상태 보관
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j raw-state.next.zip data/investment_advisor.sqlite data/kosis_cycle_cache.csv data/export_flash_cache.csv
          mv raw-state.next.zip raw-state.zip
          gh release upload data-state raw-state.zip --clobber
      - name: 공유 Mart 반영
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f data/share_snapshot.sqlite data/country_coverage_status.json
          git diff --cached --quiet || git commit -m "data: expand monitored monthly destinations"
          git pull --rebase origin main
          git push
